<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel</title>
  </head>
  <body>
    <div class="container">
      <div class="carousel">
        <button class="slide-button left"><</button>
        <div class="slide-viewing-window">
          <div class="slide-tape">
            <div class="slide"><img src="./media/plains.webp" /></div>
            <div class="slide"><img src="./media/island.jpg" /></div>
            <div class="slide"><img src="./media/swamp.jpg" /></div>
            <div class="slide"><img src="./media/mountain.jpg" /></div>
            <div class="slide"><img src="./media/forest.jpg" /></div>
          </div>
        </div>
        <button class="slide-button right">></button>
      </div>
      <div class="slide-tracker">
        <div class="tracker-circle"></div>
        <div class="tracker-circle"></div>
        <div class="tracker-circle"></div>
        <div class="tracker-circle"></div>
        <div class="tracker-circle"></div>
      </div>
    </div>
  </body>
</html>
